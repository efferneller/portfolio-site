name: Publish to REG.RU

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reg-ru-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Build static site
        run: npm run build
      - name: Check publication safety
        run: |
          node --test tests/build-assets.test.mjs
          python3 -m unittest discover -s tests
      - name: Upload assets, then pages
        env:
          REG_FTP_HOST: server26.hosting.reg.ru
          REG_FTP_USER: u3700684
          REG_FTP_ROOT: /www/efferneller.ru
          REG_FTP_PASSWORD: ${{ secrets.REG_FTP_PASSWORD }}
        run: python3 scripts/deploy_reg.py
