[build]
  command = "npm run build"
  publish = "dist"
  # Production publication moved to REG.RU via GitHub Actions.
  # Exit 0 skips every Git-triggered Netlify build, including main.
  ignore = "exit 0"

[build.environment]
  NODE_VERSION = "22"

# Generated image filenames contain their content hash. Keep the manifest and
# HTML on Netlify's default revalidation policy.
[[headers]]
  for = "/static/optimized/:folder/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/static/optimized/:folder/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
