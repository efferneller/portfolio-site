[build]
  command = "npm run build"
  publish = "dist"
  # Git-connected Netlify builds continue only for pushes/merges to main.
  # Exit 0 skips a build; exit 1 continues it.
  ignore = "node -e \"process.exit(process.env.BRANCH === 'main' ? 1 : 0)\""

[build.environment]
  NODE_VERSION = "22"

# Generated image filenames contain their content hash. Keep the manifest and
# HTML on Netlify's default revalidation policy.
[[headers]]
  for = "/static/optimized/:folder/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/static/optimized/:folder/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
